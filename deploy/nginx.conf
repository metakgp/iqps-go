# One domain for everything, e.g. https://pyq.iitbhilai.ac.in
#   /api/*   -> Rust backend (the /api prefix is stripped)
#   /iqps/*  -> uploaded PDFs (pending + approved)
#   /*       -> frontend build (optional; skip if the frontend is on Vercel)
server {
    listen 80;
    server_name _;

    # Uploads: up to 10 files x 15 MB each
    client_max_body_size 160m;

    location /api/ {
        proxy_pass http://backend:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /iqps/ {
        root /srv/static;
        # Never let an uploaded file run as a web page
        types { application/pdf pdf; }
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff;
        add_header Access-Control-Allow-Origin *;
        expires 7d;
    }

    location / {
        root /srv/frontend;
        try_files $uri /index.html;
    }

    location /assets/ {
        root /srv/frontend;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
